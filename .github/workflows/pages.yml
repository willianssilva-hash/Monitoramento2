name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - arena/01a0ee71-monitoramento2
      - main
  schedule:
    # Atualiza o snapshot das planilhas a cada 15 minutos quando o workflow
    # estiver presente na branch padrão do repositório.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Google Sheets snapshot
        run: python3 scripts/fetch_sheets.py

      - name: Audit generated snapshot
        run: python3 scripts/audit_snapshot.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
